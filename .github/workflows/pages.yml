name: Deploy Pages backup

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publication_profile:
        description: Backup publication profile
        required: true
        default: pages-project
        type: choice
        options:
          - pages-project
          - pages-root

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      publication_profile: ${{ steps.profile.outputs.name }}
      normalized_human_sha256: ${{ steps.publication.outputs.normalized_human_sha256 }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: npm ci
      - name: Select publication profile
        id: profile
        env:
          REQUESTED_PROFILE: ${{ inputs.publication_profile || 'pages-project' }}
        run: node scripts/select-pages-profile.mjs "$REQUESTED_PROFILE"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Verify Pages target matches profile
        env:
          PUBLICATION_PROFILE: ${{ steps.profile.outputs.name }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/validate-pages-target.mjs "$PUBLICATION_PROFILE" "$PAGES_BASE_PATH"
      - name: Install validation browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate and build Pages publication
        id: publication
        env:
          PUBLICATION_PROFILE: ${{ steps.profile.outputs.name }}
        run: npm run pages:build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .artifacts/pages-publication
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke:
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    permissions:
      contents: read
    steps:
      - name: Check out deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use supported npm
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies
        run: npm ci
      - name: Install smoke browser
        run: npx playwright install --with-deps chromium
      - name: Smoke deployed Pages publication
        run: >-
          npm run pages:smoke --
          "${{ needs.build.outputs.publication_profile }}"
          "${{ needs.deploy.outputs.page_url }}"
          "$GITHUB_SHA"
          "$GITHUB_RUN_ID"
          "${{ needs.build.outputs.normalized_human_sha256 }}"
      - name: Upload Pages deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/deployments/pages-*
          if-no-files-found: warn
          retention-days: 90
