name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Require generated catalog in pull requests
        if: github.event_name == 'pull_request'
        run: npm run catalog && git diff --exit-code -- docs/catalog.md
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run validate
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .artifacts/quality
            tmp/playwright-results
            tmp/playwright-browser-quality-results
            tmp/playwright-a11y-results
            tmp/playwright-component-results
            tmp/playwright-visual-results
