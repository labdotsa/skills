name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Require generated catalog in pull requests
        if: github.event_name == 'pull_request'
        run: npm run catalog && git diff --exit-code -- docs/catalog.md
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run validate:automated
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .artifacts/quality
            tmp/playwright-results
            tmp/playwright-browser-quality-results
            tmp/playwright-a11y-results
            tmp/playwright-component-results
            tmp/playwright-visual-results
