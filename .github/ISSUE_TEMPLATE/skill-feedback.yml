name: Skill feedback
description: Report a problem or improvement after using a published skill.
title: "[Feedback]: "
labels:
  - skill-feedback
body:
  - type: input
    id: skill
    attributes:
      label: Skill name
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What did you ask the agent to do?
      description: Remove secrets and private project information.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Agent client and version
      placeholder: Codex, Claude Code, Cursor, or another compatible client
